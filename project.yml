name: YYMusic

options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  YYMusic:
    type: application
    platform: iOS
    sources: [YYMusic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yymusic.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: YYMusic/YYMusic-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: YYMusic/Info.plist
      properties:
        CFBundleDisplayName: YY Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  YYMusic:
    build:
      targets:
        YYMusic: all
    run:
      config: Debug
    archive:
      config: Release
